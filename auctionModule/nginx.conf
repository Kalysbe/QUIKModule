server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Проксируем API на backend-контейнер (имя сервиса из docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # JWT: некоторые edge-прокси режут Authorization на POST — дублируем явно
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-KSE-Authorization $http_x_kse_authorization;
        proxy_pass_header Authorization;
    }

    # WebSocket (котировки/заявки в реальном времени), см. backend/src/services/instrumentOrdersWSService.js
    location /ws {
        proxy_pass http://backend:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Swagger-документация backend (удобно открыть через тот же домен)
    location /api-docs {
        proxy_pass http://backend:5000/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: все остальные маршруты отдаём в index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
